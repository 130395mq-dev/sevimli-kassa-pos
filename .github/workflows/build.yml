name: Kassa EXE

# Kompyuterda hech narsa yig'ilmaydi — hammasini GitHub qiladi:
#
#   1. Har push'da (main) — testlar (Linux).
#   2. Testlar o'tsa — Windows x64 EXE (onedir) yig'iladi, ZIP qilinadi.
#   3. ZIP GitHub Release'ga qo'yiladi (v<versiya>).
#   4. Server (hub) 10 daqiqada bir Release'ga qaraydi va yangi ZIP'ni
#      O'ZI olib panelning «Versiyalar» ro'yxatiga qo'shadi
#      (sales/releases.py). Kassalar 30 daqiqa ichida o'zini yangilaydi.
#      Hech qanday maxfiy kalit kerak emas.
#
# Versiya raqami — pos/version.py. Shu raqam avval chiqarilgan bo'lsa,
# Release yangilanmaydi (xato emas — raqamni oshirib qayta push qilinadi).
#
# Ish stolidagi KASSA-GITHUBGA-YUKLASH.bat shu jarayonni boshlaydi.

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Testlar (Linux)
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Kutubxonalar
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0 >/dev/null
      - name: Modullar yuklanadimi
        run: python -c "import pos.main, pos.ui.main_window, pos.ui.payment_dialog, pos.ui.split_payment, pos.ui.login_screen, pos.ui.dialogs"
      - name: Kassa testlari
        run: |
          python -m unittest pos.test_pos pos.test_store pos.test_links pos.test_update pos.test_split pos.test_session pos.test_reliability pos.test_receipt_integrity
          python -m shared.test_receipt

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem tools/*.ps1) {
            $parseTokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$parseTokens, [ref]$parseErrors)
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      - name: Render UI at supported screen sizes
        run: python -m pos.render_preview
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sevimli-ui-preview
          path: previews/

  build:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
    name: Windows x64 EXE → Release
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Versiya (pos/version.py)
        id: ver
        shell: pwsh
        run: |
          $m = Select-String -Path "pos\version.py" -Pattern 'VERSION\s*=\s*"([^"]+)"'
          if (-not $m) { throw "pos/version.py dan versiya o'qilmadi" }
          $v = $m.Matches[0].Groups[1].Value
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Versiya: $v"

      - name: Kutubxonalar
        run: |
          pip install -r requirements.txt
          pip install pyinstaller==6.11.1

      - name: UCRT (eski Windows uchun)
        shell: pwsh
        run: |
          if (Test-Path "build\ucrt.zip") {
            Expand-Archive -Path "build\ucrt.zip" -DestinationPath "build\ucrt" -Force
            Write-Host ("UCRT: " + (Get-ChildItem build\ucrt -Filter *.dll).Count + " ta dll")
          }

      - name: Inter shrifti (bo'lmasa Segoe UI ishlaydi)
        shell: pwsh
        continue-on-error: true
        run: python pos/fonts/fetch_inter.py

      - name: Yig'ish (onedir)
        run: pyinstaller build/SevimliKassa.spec --noconfirm --clean

      - name: Tekshirish
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\SevimliKassa\SevimliKassa.exe")) { throw "SevimliKassa.exe yig'ilmadi" }
          if (-not (Test-Path "dist\SevimliKassa\_internal\ucrtbase.dll")) { Write-Warning "ucrtbase.dll qadalmadi (eski Windows'da ochilmasligi mumkin)" }
          Compress-Archive -Path dist/SevimliKassa -DestinationPath dist/SevimliKassa.zip -Force
          $mb = [math]::Round((Get-Item dist/SevimliKassa.zip).Length / 1MB, 1)
          Write-Host "ZIP: $mb MB"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SevimliKassa-${{ steps.ver.outputs.version }}
          path: dist/SevimliKassa.zip

      - name: Bu versiya avval chiqarilganmi? (teg bormi)
        id: tag
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $found = git ls-remote --tags origin "refs/tags/v$v"
          if ($found) {
            Write-Warning "v$v tegi allaqachon bor — Release yangilanmaydi. pos/version.py dagi raqamni oshiring."
            "new=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "new=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Publish verified Windows build
        if: steps.tag.outputs.new == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          KASSA_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if ($env:KASSA_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid version" }
          git log -1 --format=%B | Out-File -Encoding utf8 release-notes.txt
          gh release create "v$env:KASSA_VERSION" dist/SevimliKassa.zip --target "$env:GITHUB_SHA" --title "Sevimli Kassa $env:KASSA_VERSION" --notes-file release-notes.txt
          if ($LASTEXITCODE -ne 0) { throw "Release failed" }
